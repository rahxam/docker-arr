  radarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/radarr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/radarr/config:/config
    - ${FAST_ROOT}/mediarr_data/radarr/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/radarr/custom-cont-init.d:/custom-cont-init.d
    depends_on:
    - prowlarr
    - qbittorrent
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.radarr.rule=Host(`radarr.${ARR_DOMAIN}`)
    - traefik.http.routers.radarr.entrypoints=https
    - traefik.http.routers.radarr.tls=true
    - traefik.http.routers.radarr.middlewares=authentik@docker
    - traefik.http.services.radarr.loadbalancer.server.port=7878
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:7878/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:7878/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: arr-radarr
  sonarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/sonarr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/sonarr/config:/config
    - ${FAST_ROOT}/mediarr_data/sonarr/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/sonarr/custom-cont-init.d:/custom-cont-init.d
    depends_on:
    - prowlarr
    - qbittorrent
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.sonarr.rule=Host(`sonarr.${ARR_DOMAIN}`)
    - traefik.http.routers.sonarr.entrypoints=https
    - traefik.http.routers.sonarr.tls=true
    - traefik.http.routers.sonarr.middlewares=authentik@docker
    - traefik.http.services.sonarr.loadbalancer.server.port=8989
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8989/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8989/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: arr-sonarr
  sabnzbd:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    image: linuxserver/sabnzbd:latest
    network_mode: service:gluetun-nl
    depends_on:
      gluetun-nl:
        condition: service_healthy
        restart: true
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/sabnzbd/config:/config
    - ${FAST_ROOT}/mediarr_data/sabnzbd/custom-cont-init.d:/custom-cont-init.d
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8080/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    container_name: arr-sabnzbd
  tautulli:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: linuxserver/tautulli:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.tautulli.rule=Host(`tautulli.${ARR_DOMAIN}`)
    - traefik.http.routers.tautulli.entrypoints=https
    - traefik.http.routers.tautulli.tls=true
    - traefik.http.routers.tautulli.middlewares=authentik@docker
    - traefik.http.services.tautulli.loadbalancer.server.port=8181
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8181/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8181/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/tautulli/config:/config
    container_name: arr-tautulli
  tdarr:
    restart: "no"
    devices:
    - /dev/dri/card0:/dev/dri/card0
    - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK_SET=002
    - serverIP=0.0.0.0
    - serverPort=8266
    - webUIPort=8265
    - internalNode=true
    - inContainer=true
    - ffmpegVersion=7
    - nodeName=MyInternalNode
    - ffmpegAccel=amd-h264
    - ffmpegDecoderAccel=amd-h264
    networks:
    - traefik
    image: ghcr.io/haveagitgat/tdarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.tdarr.rule=Host(`tdarr.${ARR_DOMAIN}`)
    - traefik.http.routers.tdarr.entrypoints=https
    - traefik.http.routers.tdarr.tls=true
    - traefik.http.routers.tdarr.middlewares=authentik@docker
    - traefik.http.services.tdarr.loadbalancer.server.port=8265
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8265/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8265/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${FAST_ROOT}/mediarr_data/tdarr/server:/app/server
    - ${FAST_ROOT}/mediarr_data/tdarr/configs:/app/configs
    - ${FAST_ROOT}/mediarr_data/tdarr/logs:/app/logs
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/media/music:/mnt/media/music
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${SLOW_ROOT}/temp:/temp
    container_name: arr-tdarr
  maintainerr:
    restart: always
    environment:
    - TZ=${TZ}
    networks:
    - traefik
    image: ghcr.io/maintainerr/maintainerr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.maintainerr.rule=Host(`maintainerr.${ARR_DOMAIN}`)
    - traefik.http.routers.maintainerr.entrypoints=https
    - traefik.http.routers.maintainerr.tls=true
    - traefik.http.routers.maintainerr.middlewares=authentik@docker
    - traefik.http.services.maintainerr.loadbalancer.server.port=6246
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:6246/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:6246/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/maintainerr/data:/opt/data
    container_name: arr-maintainerr
  profilarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: santiagosayshey/profilarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.profilarr.rule=Host(`profilarr.${ARR_DOMAIN}`)
    - traefik.http.routers.profilarr.entrypoints=https
    - traefik.http.routers.profilarr.tls=true
    - traefik.http.routers.profilarr.middlewares=authentik@docker
    - traefik.http.services.profilarr.loadbalancer.server.port=6868
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:6868/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:6868/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/profilarr/config:/config
    container_name: arr-profilarr
  suggestarr:
    restart: always
    environment:
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - SUGGESTARR_PORT=5000
    networks:
    - traefik
    image: ciuse99/suggestarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.suggestarr.rule=Host(`suggestarr.${ARR_DOMAIN}`)
    - traefik.http.routers.suggestarr.entrypoints=https
    - traefik.http.routers.suggestarr.tls=true
    - traefik.http.routers.suggestarr.middlewares=authentik@docker
    - traefik.http.services.suggestarr.loadbalancer.server.port=5000
    healthcheck:
      test:
      - CMD-SHELL
      - ps aux | grep -Eq '[s]uggestarr|[p]ython|[n]ode'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/suggestarr/config_files:/app/config/config_files
    container_name: arr-suggestarr
  prefetcharr:
    restart: always
    environment:
    - |
      PREFETCHARR_CONFIG=
      interval = 900
      log_dir = "/log"
      log_level = "Info"
      prefetch_num = 2
      request_seasons = true
      connection_retries = 6

      [media_server]
      type = "Tautulli"
      url = "http://tautulli:8181"
      api_key = "${TAUTULLI__APIKEY}"

      [sonarr]
      url = "http://sonarr:8989"
      api_key = "${SONARR__APIKEY}"
    networks:
    - traefik
    image: phueber/prefetcharr:latest
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f prefetcharr >/dev/null || pgrep -f python >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/prefetcharr/log:/log
    container_name: arr-prefetcharr
  umlautadaptarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - SONARR__ENABLED=true
    - SONARR__HOST=http://sonarr:8989
    - SONARR__APIKEY=${SONARR__APIKEY}
    - RADARR__ENABLED=true
    - RADARR__HOST=http://radarr:7878
    - RADARR__APIKEY=${RADARR__APIKEY}
    - READARR__ENABLED=false
    - LIDARR__ENABLED=false
    - LIDARR__HOST=http://lidarr:8686
    - LIDARR__APIKEY=${LIDARR__APIKEY}
    networks:
    - traefik
    image: pcjones/umlautadaptarr:latest
    healthcheck:
      disable: true
    container_name: arr-umlautadaptarr
  calibre-web-automated:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
