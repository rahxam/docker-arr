    networks:
    - traefik
    image: crocodilestick/calibre-web-automated:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/calibre-web-automated/config:/config
    - ${FAST_ROOT}/mediarr_data/calibre-web-automated/ingest:/cwa-book-ingest
    - ${SLOW_ROOT}/calibre_data:/calibre-library
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.calibre-web-automated.rule=Host(`cwa.${ARR_DOMAIN}`)
    - traefik.http.routers.calibre-web-automated.entrypoints=https
    - traefik.http.routers.calibre-web-automated.tls=true
    - traefik.http.routers.calibre-web-automated.middlewares=authentik@docker
    - traefik.http.services.calibre-web-automated.loadbalancer.server.port=8083
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8083/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8083/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    container_name: arr-calibre-web-automated
  mediathekarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - DOWNLOAD_INCOMPLETE_PATH=/mnt/downloads/mediathek/incomplete
    - DOWNLOAD_COMPLETE_PATH=/mnt/downloads/mediathek/complete
    - CATEGORIES=tv,movies
    - MEDIATHEKARR_API_BASE_URL=https://mediathekarr.pcjones.de/api/v1
    network_mode: service:tailscale-unesty
    depends_on:
      tailscale-unesty:
        condition: service_healthy
        restart: true
    image: pcjones/mediathekarr:beta
    healthcheck:
      test:
      - CMD-SHELL
      - awk 'NR>1 && $$2 ~ /:138F$$/ && $$4 == "0A" {found=1} END{exit found?0:1}' /proc/net/tcp /proc/net/tcp6
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${FAST_ROOT}/mediarr_data/mediathekarr/config:/app/config
    - /mnt/fast/appdata/downloads/mediathek/complete:/mnt/downloads/mediathek/complete
    - /mnt/fast/appdata/downloads/mediathek/incomplete:/mnt/downloads/mediathek/incomplete
    container_name: arr-mediathekarr
  shelfmark:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: ghcr.io/calibrain/shelfmark:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/shelfmark/config:/config
    - ${FAST_ROOT}/mediarr_data/calibre-web-automated/ingest:/books
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.shelfmark.rule=Host(`shelfmark.${ARR_DOMAIN}`)
    - traefik.http.routers.shelfmark.entrypoints=https
    - traefik.http.routers.shelfmark.tls=true
    - traefik.http.routers.shelfmark.middlewares=authentik@docker
    - traefik.http.services.shelfmark.loadbalancer.server.port=8084
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8084/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8084/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: arr-shelfmark
  qbittorrent:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - WEBUI_PORT=8081
    - TORRENTING_PORT=6881
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun-nl
    depends_on:
      gluetun-nl:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8081/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8081/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/qbittorrent/config:/config
    container_name: arr-qbittorrent
