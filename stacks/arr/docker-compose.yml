  soularr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - SCRIPT_INTERVAL=300
    networks:
    - traefik
    image: mrusse08/soularr:latest
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f soularr >/dev/null || pgrep -f python >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/soularr/config:/data
    - /mnt/fast/appdata/downloads:/downloads
    - /etc/localtime:/etc/localtime:ro
    container_name: arr-soularr
  slskd:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - ASPNETCORE_URLS=http://0.0.0.0:5030
    - SLSKD_REMOTE_CONFIGURATION=true
    image: slskd/slskd
    network_mode: service:gluetun-nl
    depends_on:
      gluetun-nl:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:5030/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:5030/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - /mnt/fast/appdata/downloads:/downloads
    - ${FAST_ROOT}/mediarr_data/slskd/config:/app
    container_name: arr-slskd
  soulsync:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK=022
    - TZ=${TZ}
    - FLASK_ENV=production
    - PYTHONPATH=/app
    - SOULSYNC_CONFIG_PATH=/app/config/config.json
    networks:
    - traefik
    image: boulderbadgedad/soulsync:latest
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          # 20% of 8-core AMD 8700G = 1.6 cores; using 1.5 to be safe
          cpus: "1.5"
          memory: 3G
        reservations:
          cpus: "0.8"
          memory: 1G
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.soulsync.rule=Host(`soulsync.${ARR_DOMAIN}`)
    - traefik.http.routers.soulsync.entrypoints=https
    - traefik.http.routers.soulsync.tls=true
    - traefik.http.routers.soulsync.middlewares=authentik@docker
    - traefik.http.services.soulsync.loadbalancer.server.port=8008
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8008/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8008/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${FAST_ROOT}/mediarr_data/soulsync/scripts:/app/scripts
    - ${FAST_ROOT}/mediarr_data/soulsync/config:/app/config
    - ${FAST_ROOT}/mediarr_data/soulsync/logs:/app/logs
    - ${FAST_ROOT}/mediarr_data/soulsync/staging:/app/Staging
    - /mnt/fast/appdata/downloads/slskd/completed:/app/downloads
    - /mnt/fast/media/music:/app/Transfer
    - soulsync_data:/app/data
    container_name: arr-soulsync
  quasarr:
    restart: always
    environment:
    - DOCKER=true
    - TZ=${TZ}
    - AUTH=form
    - INTERNAL_ADDRESS=http://quasarr:8080
    - EXTERNAL_ADDRESS=https://quasarr.${ARR_DOMAIN}
    networks:
    - traefik
    image: ghcr.io/rix1337/quasarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.quasarr.rule=Host(`quasarr.${ARR_DOMAIN}`)
    - traefik.http.routers.quasarr.entrypoints=https
    - traefik.http.routers.quasarr.tls=true
    - traefik.http.routers.quasarr.middlewares=authentik@docker
    - traefik.http.services.quasarr.loadbalancer.server.port=8080
    healthcheck:
      test:
      - CMD-SHELL
      - awk 'NR>1 && $$2 ~ /:1F90/ && $$4 == "0A" {found=1} END{exit found?0:1}' /proc/net/tcp /proc/net/tcp6
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
    - ${FAST_ROOT}/mediarr_data/quasarr/config:/config
    container_name: arr-quasarr
  ytdl-sub:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    - DEFAULT_WORKSPACE=/config/ytdl-sub-configs
    - UPDATE_YT_DLP_ON_START=stable
    - CRON_SCHEDULE=0 */6 * * *
    - CRON_RUN_ON_START=true
    networks:
    - traefik
    image: ghcr.io/jmbannon/ytdl-sub:latest
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f '[c]rond' >/dev/null || pgrep -f '[s]6-svscan' >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${FAST_ROOT}/mediarr_data/ytdl-sub/config:/config
    - /mnt/fast/media/music:/music
    - /mnt/fast/media/youtube:/tv_shows
    - /mnt/fast/media/music_videos:/music_videos
    container_name: arr-ytdl-sub
  kometa:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - KOMETA_CONFIG=/config/config.yml
    - KOMETA_TIMES=${KOMETA_TIMES:-03:30}
    image: lscr.io/linuxserver/kometa:latest
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f '[s]6-svscan' >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
    - ${FAST_ROOT}/mediarr_data/kometa/config:/config
    container_name: arr-kometa
  gluetun-nl:
    image: qmcgaw/gluetun
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    networks:
    - traefik
    volumes:
    - /mnt/fast/appdata/vpn_data/gluetun-nl:/gluetun
    environment:
    - VPN_SERVICE_PROVIDER=custom
    - VPN_TYPE=wireguard
    - WIREGUARD_PRIVATE_KEY=${WIREGUARD_NL_PRIVATE_KEY}
    - WIREGUARD_ADDRESSES=${WIREGUARD_NL_ADDRESS}
    - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PEER_PUBLIC_KEY}
    - WIREGUARD_ENDPOINT_IP=${WIREGUARD_NL_ENDPOINT_IP}
    - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
    - DNS_UPSTREAM_PLAIN_ADDRESSES=${WIREGUARD_DNS}
    - FIREWALL_INPUT_PORTS=8080,8081,5030
    - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_NL_CONTROL_API_KEY}"}
    - HTTPPROXY=on
    - SHADOWSOCKS=on
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.hartig.es`)
    - traefik.http.routers.sabnzbd.entrypoints=https
    - traefik.http.routers.sabnzbd.tls=true
    - traefik.http.routers.sabnzbd.middlewares=authentik@docker
    - traefik.http.routers.sabnzbd.service=sabnzbd
    - traefik.http.services.sabnzbd.loadbalancer.server.port=8080
    - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.hartig.es`)
    - traefik.http.routers.qbittorrent.entrypoints=https
    - traefik.http.routers.qbittorrent.tls=true
    - traefik.http.routers.qbittorrent.middlewares=authentik@docker
    - traefik.http.routers.qbittorrent.service=qbittorrent
    - traefik.http.services.qbittorrent.loadbalancer.server.port=8081
    - traefik.http.routers.slskd.rule=Host(`slskd.hartig.es`)
    - traefik.http.routers.slskd.entrypoints=https
    - traefik.http.routers.slskd.tls=true
    - traefik.http.routers.slskd.middlewares=authentik@docker
    - traefik.http.routers.slskd.service=slskd
    - traefik.http.services.slskd.loadbalancer.server.port=5030
    healthcheck:
      disable: false
    restart: always
    container_name: vpn-gluetun-nl
  tailscale-unesty:
    image: tailscale/tailscale:stable
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    networks:
    - traefik
    volumes:
    - /mnt/fast/appdata/vpn_data/tailscale-unesty/state:/var/lib/tailscale
    environment:
    - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_USERSPACE=false
    - TS_EXTRA_ARGS=--hostname=vpn-tailscale-unesty --exit-node=100.117.152.83 --exit-node-allow-lan-access=true --accept-routes=true --accept-dns=false
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.mediathekarr.rule=Host(`mediathekarr.hartig.es`)
    - traefik.http.routers.mediathekarr.entrypoints=https
    - traefik.http.routers.mediathekarr.tls=true
    - traefik.http.routers.mediathekarr.middlewares=authentik@docker
    - traefik.http.routers.mediathekarr.service=mediathekarr
    - traefik.http.services.mediathekarr.loadbalancer.server.port=5007
    healthcheck:
      test:
      - CMD-SHELL
      - tailscale status >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    container_name: vpn-tailscale-unesty
networks:
  traefik:
    external: true
  internal: null
volumes:
  soulsync_data: null
  transcode_cache: null
