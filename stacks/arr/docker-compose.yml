  postgres:
    image: docker.io/library/postgres:14
    networks:
    - internal
    volumes:
    - ${FAST_ROOT}/mediarr_data/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    container_name: arr-postgres
  pgadmin-arr:
    restart: always
    environment:
    - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
    image: dpage/pgadmin4
    networks:
    - internal
    - traefik
    volumes:
    - ${FAST_ROOT}/mediarr_data/pgadmin/servers.json:/pgadmin4/servers.json
    - ${FAST_ROOT}/mediarr_data/pgadmin/pgadmin:/var/lib/pgadmin
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.pgadmin-arr.rule=Host(`pgadmin.${ARR_DOMAIN}`)
    - traefik.http.routers.pgadmin-arr.entrypoints=https
    - traefik.http.routers.pgadmin-arr.tls=true
    - traefik.http.routers.pgadmin-arr.middlewares=authentik@docker
    - traefik.http.services.pgadmin-arr.loadbalancer.server.port=80
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    container_name: arr-pgadmin-arr
