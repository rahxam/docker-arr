x-default-container:
  restart: always
  environment:
  - PUID=${PUID}
  - PGID=${PGID}
  - TZ=${TZ}
services:

  bazarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/bazarr:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/bazarr/config:/config
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    depends_on:
    - sonarr
    - radarr
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.bazarr.rule=Host(`bazarr.${ARR_DOMAIN}`)
    - traefik.http.routers.bazarr.entrypoints=https
    - traefik.http.routers.bazarr.tls=true
    - traefik.http.routers.bazarr.middlewares=authentik@docker
    - traefik.http.services.bazarr.loadbalancer.server.port=6767
    healthcheck:
      test:
      - CMD-SHELL
      - code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:6767/ || true); echo "$$code" | grep -Eq '^(200|301|302|401)$'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: arr-bazarr
  seerr:
    restart: always
    init: true
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - PORT=5055
    networks:
    - traefik
    image: ghcr.io/seerr-team/seerr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.seerr.rule=Host(`overseerr.${ARR_DOMAIN}`) || Host(`seerr.${ARR_DOMAIN}`)
    - traefik.http.routers.seerr.entrypoints=https
    - traefik.http.routers.seerr.tls=true
    - traefik.http.routers.seerr.middlewares=authentik@docker
    - traefik.http.services.seerr.loadbalancer.server.port=5055
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    volumes:
    - ${FAST_ROOT}/mediarr_data/seerr/config:/app/config
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    container_name: arr-seerr
  prowlarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: linuxserver/prowlarr:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/prowlarr/config:/config
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    depends_on:
    - flaresolverr
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${ARR_DOMAIN}`)
    - traefik.http.routers.prowlarr.entrypoints=https
    - traefik.http.routers.prowlarr.tls=true
    - traefik.http.routers.prowlarr.middlewares=authentik@docker
    - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:9696/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:9696/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: arr-prowlarr
  flaresolverr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - LOG_HTML=${LOG_HTML:-false}
    - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    networks:
    - traefik
    image: ghcr.io/flaresolverr/flaresolverr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - /mnt/fast/appdata/downloads:/mnt/downloads
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${ARR_DOMAIN}`)
    - traefik.http.routers.flaresolverr.entrypoints=https
    - traefik.http.routers.flaresolverr.tls=true
    - traefik.http.routers.flaresolverr.middlewares=authentik@docker
    - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
    healthcheck:
      test:
      - CMD-SHELL
      - (command -v wget >/dev/null 2>&1 && wget --no-verbose --tries=1 --spider http://localhost:8191/) || (command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8191/ >/dev/null) || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    container_name: arr-flaresolverr
