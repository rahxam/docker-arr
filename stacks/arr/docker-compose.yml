x-default-container:
  restart: always
  environment:
  - PUID=${PUID}
  - PGID=${PGID}
  - TZ=${TZ}
services:

  bazarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/bazarr:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/bazarr/config:/config
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    depends_on:
    - sonarr
    - radarr
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.bazarr.rule=Host(`bazarr.${ARR_DOMAIN}`)
    - traefik.http.routers.bazarr.entrypoints=https
    - traefik.http.routers.bazarr.tls=true
    - traefik.http.services.bazarr.loadbalancer.server.port=6767
    container_name: arr-bazarr
  overseerr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
    - traefik
    image: lscr.io/linuxserver/overseerr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.overseerr.rule=Host(`overseerr.${ARR_DOMAIN}`)
    - traefik.http.routers.overseerr.entrypoints=https
    - traefik.http.routers.overseerr.tls=true
    - traefik.http.services.overseerr.loadbalancer.server.port=5055
    volumes:
    - ${FAST_ROOT}/mediarr_data/overseer/config:/config
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    container_name: arr-overseerr
  prowlarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: linuxserver/prowlarr:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/prowlarr/config:/config
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    depends_on:
    - flaresolverr
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${ARR_DOMAIN}`)
    - traefik.http.routers.prowlarr.entrypoints=https
    - traefik.http.routers.prowlarr.tls=true
    - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    container_name: arr-prowlarr
  flaresolverr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - LOG_HTML=${LOG_HTML:-false}
    - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    networks:
    - traefik
    image: ghcr.io/flaresolverr/flaresolverr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${ARR_DOMAIN}`)
    - traefik.http.routers.flaresolverr.entrypoints=https
    - traefik.http.routers.flaresolverr.tls=true
    - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
    container_name: arr-flaresolverr
  lidarr_extended:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/lidarr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/lidarr_extended/config:/config
    - ${FAST_ROOT}/mediarr_data/lidarr_extended/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/lidarr_extended/custom-cont-init.d:/custom-cont-init.d
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.lidarr.rule=Host(`lidarr-extended.${ARR_DOMAIN}`)
    - traefik.http.routers.lidarr.entrypoints=https
    - traefik.http.routers.lidarr.tls=true
    - traefik.http.services.lidarr.loadbalancer.server.port=8686
    container_name: arr-lidarr_extended
  postgres:
    image: docker.io/library/postgres:14
    networks:
    - internal
    volumes:
    - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    container_name: arr-postgres
  pgadmin-arr:
    restart: always
    environment:
    - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
    image: dpage/pgadmin4
    networks:
    - internal
    - traefik
    volumes:
    - ${FAST_ROOT}/mediarr_data/pgadmin/servers.json:/pgadmin4/servers.json
    - ${FAST_ROOT}/mediarr_data/pgadmin/pgadmin:/var/lib/pgadmin
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.pgadmin-arr.rule=Host(`pgadmin.${ARR_DOMAIN}`)
    - traefik.http.routers.pgadmin-arr.entrypoints=https
    - traefik.http.routers.pgadmin-arr.tls=true
    - traefik.http.services.pgadmin-arr.loadbalancer.server.port=80
    container_name: arr-pgadmin-arr
  lidarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    image: ghcr.io/linuxserver-labs/prarr:lidarr-plugins
    volumes:
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/lidarr/config:/config
    networks:
    - internal
    - traefik
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.lidarr.rule=Host(`lidarr.${ARR_DOMAIN}`)
    - traefik.http.routers.lidarr.entrypoints=https
    - traefik.http.routers.lidarr.tls=true
    - traefik.http.services.lidarr.loadbalancer.server.port=8686
    container_name: arr-lidarr
  radarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/radarr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/radarr/config:/config
    - ${FAST_ROOT}/mediarr_data/radarr/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/radarr/custom-cont-init.d:/custom-cont-init.d
    ports:
    - 7878:7878
    depends_on:
    - prowlarr
    - qbittorrent
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.radarr.rule=Host(`radarr.${ARR_DOMAIN}`)
    - traefik.http.routers.radarr.entrypoints=https
    - traefik.http.routers.radarr.tls=true
    - traefik.http.services.radarr.loadbalancer.server.port=7878
    container_name: arr-radarr
  readarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/readarr:develop
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${SLOW_ROOT}/calibre_data/:/calibre
    - ${FAST_ROOT}/mediarr_data/readarr/config:/config
    - ${FAST_ROOT}/mediarr_data/readarr/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/readarr/custom-cont-init.d:/custom-cont-init.d
    depends_on:
    - prowlarr
    - qbittorrent
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.readarr.rule=Host(`readarr.${ARR_DOMAIN}`)
    - traefik.http.routers.readarr.entrypoints=https
    - traefik.http.routers.readarr.tls=true
    - traefik.http.services.readarr.loadbalancer.server.port=8787
    container_name: arr-readarr
  sonarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: lscr.io/linuxserver/sonarr:latest
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/sonarr/config:/config
    - ${FAST_ROOT}/mediarr_data/sonarr/custom-services.d:/custom-services.d
    - ${FAST_ROOT}/mediarr_data/sonarr/custom-cont-init.d:/custom-cont-init.d
    depends_on:
    - prowlarr
    - qbittorrent
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.sonarr.rule=Host(`sonarr.${ARR_DOMAIN}`)
    - traefik.http.routers.sonarr.entrypoints=https
    - traefik.http.routers.sonarr.tls=true
    - traefik.http.services.sonarr.loadbalancer.server.port=8989
    container_name: arr-sonarr
  sabnzbd:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    image: linuxserver/sabnzbd:latest
    network_mode: service:gluetun
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/sabnzbd/config:/config
    - ${FAST_ROOT}/mediarr_data/sabnzbd/custom-cont-init.d:/custom-cont-init.d
    container_name: arr-sabnzbd
  tautulli:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: linuxserver/tautulli:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.tautulli.rule=Host(`tautulli.${ARR_DOMAIN}`)
    - traefik.http.routers.tautulli.entrypoints=https
    - traefik.http.routers.tautulli.tls=true
    - traefik.http.services.tautulli.loadbalancer.server.port=8181
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/tautulli/config:/config
    container_name: arr-tautulli
  tdarr:
    restart: always
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK_SET=002
    - serverIP=0.0.0.0
    - serverPort=8266
    - webUIPort=8265
    - internalNode=true
    - inContainer=true
    - ffmpegVersion=7
    - nodeName=MyInternalNode
    networks:
    - traefik
    image: ghcr.io/haveagitgat/tdarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.tdarr.rule=Host(`tdarr.${ARR_DOMAIN}`)
    - traefik.http.routers.tdarr.entrypoints=https
    - traefik.http.routers.tdarr.tls=true
    - traefik.http.services.tdarr.loadbalancer.server.port=8265
    volumes:
    - ${FAST_ROOT}/mediarr_data/tdarr/server:/app/server
    - ${FAST_ROOT}/mediarr_data/tdarr/configs:/app/configs
    - ${FAST_ROOT}/mediarr_data/tdarr/logs:/app/logs
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${SLOW_ROOT}/temp:/temp
    devices:
    - /dev/dri:/dev/dri
    container_name: arr-tdarr
  profilarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    networks:
    - traefik
    image: santiagosayshey/profilarr:latest
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.profilarr.rule=Host(`profilarr.${ARR_DOMAIN}`)
    - traefik.http.routers.profilarr.entrypoints=https
    - traefik.http.routers.profilarr.tls=true
    - traefik.http.services.profilarr.loadbalancer.server.port=6868
    volumes:
    - ${FAST_ROOT}/mediarr_data/profilarr/config:/config
    container_name: arr-profilarr
  umlautadaptarr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - SONARR__ENABLED=true
    - SONARR__HOST=http://sonarr:8989
    - SONARR__APIKEY=${SONARR__APIKEY}
    - RADARR__ENABLED=true
    - RADARR__HOST=http://radarr:7878
    - RADARR__APIKEY=${RADARR__APIKEY}
    - READARR__ENABLED=true
    - READARR__HOST=http://readarr:8787
    - READARR__APIKEY=${READARR__APIKEY}
    - LIDARR__ENABLED=true
    - LIDARR__HOST=http://lidarr:8686
    - LIDARR__APIKEY=${LIDARR__APIKEY}
    networks:
    - traefik
    image: pcjones/umlautadaptarr:latest
    container_name: arr-umlautadaptarr
  qbittorrent:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - WEBUI_PORT=8081
    - TORRENTING_PORT=6881
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    volumes:
    - ${SLOW_ROOT}/media:/mnt/media
    - ${SLOW_ROOT}/downloads:/mnt/downloads
    - ${FAST_ROOT}/mediarr_data/qbittorrent/config:/config
    container_name: arr-qbittorrent
  lidatube:
    restart: always
    environment:
    - attempt_lidarr_import=true
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - sync_schedule=1
    - sleep_interval=60
    networks:
    - traefik
    image: thewicklowwolf/lidatube:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/lidatube/config:/lidatube/config
    - ${SLOW_ROOT}/media/music:/lidatube/downloads
    - /etc/localtime:/etc/localtime:ro
    labels:
    - traefik.enable=true
    - traefik.constraint=proxy-public
    - traefik.docker.network=traefik
    - traefik.http.routers.lidatube.rule=Host(`lidatube.${ARR_DOMAIN}`)
    - traefik.http.routers.lidatube.entrypoints=https
    - traefik.http.routers.lidatube.tls=true
    - traefik.http.services.lidatube.loadbalancer.server.port=5000
    container_name: arr-lidatube
  soularr:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - SCRIPT_INTERVAL=300
    networks:
    - traefik
    image: mrusse08/soularr:latest
    volumes:
    - ${FAST_ROOT}/mediarr_data/soularr/config:/data
    - ${SLOW_ROOT}/downloads:/downloads
    - /etc/localtime:/etc/localtime:ro
    container_name: arr-soularr
  slskd:
    restart: always
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - SLSKD_REMOTE_CONFIGURATION=true
    image: slskd/slskd
    network_mode: service:gluetun
    volumes:
    - ${SLOW_ROOT}/downloads:/downloads
    - ${FAST_ROOT}/mediarr_data/slskd/config:/app
    container_name: arr-slskd
networks:
  traefik:
    external: true
  internal: null
volumes:
  transcode_cache: null
  postgres: null
  gluetun: null
  acme: null
